name: endra

services:
  ml-sidecar:
    build:
      context: ../alive-buddy
      dockerfile: Dockerfile.ml
    restart: unless-stopped

  alive-buddy:
    build:
      context: ../alive-buddy
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ML_SIDECAR_URL: http://ml-sidecar:8001
      # 脉搏间隔：默认 60s 一天 1440 跳（每跳都写一次状态、请求一次 ML sidecar）。
      # 由于主动性发言需要"几小时没人说话"才可能放行，5 分钟一跳完全够用。
      PULSE_INTERVAL_MS: "300000"
      # 两次主动发言的最小间隔
      PROACTIVE_MIN_INTERVAL_MS: "900000"
      # 运行状态落盘间隔（原先每跳都写 SQLite）
      STATE_SAVE_INTERVAL_MS: "300000"
      # 逐跳打印完整脉搏日志（排障时开）
      PULSE_VERBOSE: "false"
      # 不部署 ChromaDB，L3 印象层自动禁用（日志中 connection refused 警告属预期）
    volumes:
      - buddy-data:/app/data/characters
    depends_on:
      - ml-sidecar
    restart: unless-stopped

  endra-connector:
    build: .
    env_file: .env
    # MC 服务跑在宿主机（systemd mc.service），容器需要 host.docker.internal 才能连 RCON
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # coffeeroom 会话 cookie 缓存（OAT 已失效时靠有效 cookie 自续签）
      - ./secrets/cookies.json:/app/cookies.json
      # readonly_shell 的可读范围：内核级只读挂载。**放进来的一切等于允许 Endra 公开引用**，
      # 不要放密钥、玩家隐私、私有日志。只想让它看系统信息（date/df/free）的话可以删掉这行。
      - ./readonly-data:/app/data/readonly:ro
    depends_on:
      - alive-buddy
    restart: unless-stopped

volumes:
  buddy-data:
